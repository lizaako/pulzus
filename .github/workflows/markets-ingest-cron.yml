name: Fetch Markets Cron

on:
  schedule:
    # Runs every 6 hours (4 times a day)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Manual trigger

jobs:
  run-markets-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger markets-ingest Supabase Edge Function
        run: |
          response_file="$(mktemp)"
          status_code="$(curl -sS -o "$response_file" -w "%{http_code}" -X POST "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/markets-ingest" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json")"

          cat "$response_file"
          echo

          if [ "$status_code" -ge 400 ]; then
            echo "markets-ingest failed with HTTP $status_code"
            exit 1
          fi
